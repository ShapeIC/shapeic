[package]
name = "shapeic-core"
version.workspace = true
edition.workspace = true
license.workspace = true
categories.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
ndarray = "0.17"
num-complex = "0.4"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shapeic-lut = { path = "../shapeic-lut" }
shapeic-layout = { path = "../shapeic-layout" }
shapeic-mna = { path = "../shapeic-mna" }

[dev-dependencies]
nalgebra = { version = "0.34", default-features = false, features = ["std"] }
ndarray-npy = { version = "0.10", default-features = false, features = ["npz"] }
shapeic-lut = { path = "../shapeic-lut" }
symbolica = "2.1"
zip = { version = "6", default-features = false, features = ["deflate"] }
