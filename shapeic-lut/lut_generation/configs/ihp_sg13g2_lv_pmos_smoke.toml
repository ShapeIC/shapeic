[pdk]
name = "ihp-sg13g2"
revision = "22f2a25f1734796de3debbbf29cf697cbbc54081"
corner = "mos_tt"
nominal_voltage = 1.2

[output]
path = "../generated/ihp_sg13g2_lv_pmos_smoke.npz"
description = "IHP SG13G2 LV PMOS smoke LUT"

[simulator]
binary = "ngspice"
temperature_c = 27.0
workers = 1
parameters = ["weff", "id", "vth", "vsat", "gm", "gds", "cgg", "cgd", "cgs", "cdg", "cdd", "cds", "csg", "csd", "css", "cgsol", "cgdol", "cjs", "cjd"]

[spice]

[[spice.directives]]
kind = "library"
path = "libs.tech/ngspice/models/cornerMOSlv.lib"
section = "mos_tt"

[[spice.directives]]
kind = "osdi"
path = "libs.tech/ngspice/osdi/psp103.osdi"

[[spice.directives]]
kind = "osdi"
path = "libs.tech/ngspice/osdi/psp103_nqs.osdi"

[device]
name = "sg13_lv_pmos"
instance = "XM1"
instance_kind = "subcircuit"
terminals = ["d", "g", "s", "b"]
length_parameter = "l"
width_parameter = "w"
finger_parameter = "ng"
width_convention = "total"
hierarchy = "n.xm1.nsg13_lv_pmos"
nf = 1
capacitance_convention = "compact_mutual"
capacitance_nf_samples = [1, 2, 3, 4]

[device.parameter_map]
weff = "weff"
vth = "vth"
vsat = "vsat"
gm = "gm"
gds = "gds"
cgg = "cgg"
cgd = "cgd"
cgs = "cgs"
cdg = "cdg"
cdd = "cdd"
cds = "cds"
csg = "csg"
csd = "csd"
css = "css"
cgsol = "cgsol"
cgdol = "cgdol"
cjs = "cjs"
cjd = "cjd"

[sweep]
length = [0.4e-6, 0.8e-6]

[sweep.vgs]
start = -0.4
stop = -0.6
step = -0.2

[sweep.vds]
start = -0.4
stop = -0.6
step = -0.2

[sweep.vbs]
start = 0.0
stop = 0.1
step = 0.1

[sweep.finger_width]
start = 0.5e-6
stop = 1.0e-6
step = 0.5e-6
