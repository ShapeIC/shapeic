[output]
path = "../generated/ihp_sg13g2_lv_nmos_5d.npz"
description = "IHP SG13G2 LV NMOS five-dimensional LUT"

[simulator]
binary = "ngspice"
temperature_c = 27.0
workers = 4
model_library = "${PDK_ROOT}/ihp-sg13g2/libs.tech/ngspice/models/cornerMOSlv.lib"
library_section = "mos_tt"
osdi_paths = [
  "${PDK_ROOT}/ihp-sg13g2/libs.tech/ngspice/osdi/psp103.osdi",
  "${PDK_ROOT}/ihp-sg13g2/libs.tech/ngspice/osdi/psp103_nqs.osdi",
]
parameters = ["weff", "id", "vth", "vsat", "gm", "gds", "cgg", "cgd", "cgs", "cdg", "cdd", "cds", "csg", "csd", "css", "cgsol", "cgdol", "cjs", "cjd"]

[device]
name = "sg13_lv_nmos"
instance = "XM1"
hierarchy = "n.xm1.nsg13_lv_nmos"
nf = 1
capacitance_nf_samples = [1, 2, 3, 4]

[sweep]
length = [0.4e-6, 0.8e-6, 1.6e-6, 3.2e-6, 6.4e-6]

[sweep.vgs]
start = 0.1
stop = 1.2
step = 0.01

[sweep.vds]
start = 0.1
stop = 1.2
step = 0.01

[sweep.vbs]
start = 0.0
stop = -1.0
step = -0.1

[sweep.finger_width]
start = 0.15e-6
stop = 10.0e-6
step = 0.5e-6
stop_inclusive = false
