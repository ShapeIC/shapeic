pdk = "ihp-sg13g2"
layout_policy = "symmetric-adjacent-with-edge-dummies-v3"
primitives = ["simplediffpair", "currentmirror"]

[output]
path = "../generated/ihp_sg13g2_ota_physical_smoke.npz"

[sweep]
length = [0.4, 0.8]
finger_width = [0.15, 10.0]
nf = [1, 2, 50]

[extraction]
backend = "synthetic"
work_directory = "../work-smoke"
keep_work = true

[device_capacitance_correction]
backend = "synthetic"
nf = [1, 2, 50]
frequencies_hz = [1.0e6, 1.0e7]

[device_capacitance_correction.simplediffpair]
vbs = [-1.0, 0.0]
vgs = [0.1, 1.2]
vds = [0.1, 1.2]

[device_capacitance_correction.currentmirror]
vbs = [0.0, 1.0]
vgs = [-1.2, -0.1]
vds = [-1.2, -0.1]
