primitives = ["simplediffpair", "currentmirror"]

[cellkit]
root = "../../../shapeic-cellkit"

[pdk]
root = "${PDK_ROOT}"
name = "${PDK}"

[electrical_models]
nmos = "../../../shapeic-lut/lut_generation/configs/ihp_sg13g2_lv_nmos.toml"
pmos = "../../../shapeic-lut/lut_generation/configs/ihp_sg13g2_lv_pmos.toml"

[output]
path = "../generated/ihp_sg13g2_ota_physical_cellkit_magic_smoke.npz"

[sweep]
# Exercise the minimum and maximum finger counts with real Magic extraction.
length = [0.4]
finger_width = [0.15]
nf = [1, 50]

[physical]
backend = "magic"
magic_binary = "magic"
work_directory = "../work-cellkit-magic-smoke"
keep_work = true

[device_capacitance_correction]
backend = "ngspice"
nf = [1, 50]
binary = "ngspice"
temperature_c = 27.0
workers = 4
frequencies_hz = [1.0e6, 1.0e7]
frequency_consistency = 0.01

[device_capacitance_correction.simplediffpair]
vbs = [-0.65]
vgs = [0.25]
vds = [0.35]

[device_capacitance_correction.currentmirror]
vbs = [0.0]
vgs = [-0.5]
vds = [-0.5]
